<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; img-src 'self' https: data: blob: http://localhost http://10.0.2.2 http://10.0.3.2; connect-src 'self' https: http://localhost:* http://10.0.2.2:* http://10.0.3.2:* ws://localhost:*; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:;" />
    <title>CityFlow - Global Real Estate Simulation</title>
    <meta name="description" content="Buy properties across the world, develop cities, take loans and compete with other investors in a living economy." />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CityFlow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('cityflow-theme') || 'system';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        var observer = new MutationObserver(function() {
          if (document.body) {
            document.body.classList.remove('trigger-position-left');
            document.body.classList.add('trigger-position-right');
            observer.disconnect();
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <style>
      .enable-accessibility-badge, .enable-accessibility-info, [class*="enable-license"], [class*="enable-branding"] {
        display: none !important;
      }
      #enable-toolbar-trigger {
        right: 16px !important;
        left: auto !important;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
