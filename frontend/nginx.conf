server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.enable.co.il; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cityflow.sizops.co.il wss://cityflow.sizops.co.il ws://localhost:* http://localhost:* https://localhost:* http://10.0.2.2:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ^~ keeps these two ahead of the asset regex below so proxied API and
    # avatar routes are never re-matched as static files.
    location ^~ /api/ {
        proxy_pass http://cityflow-backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://cityflow-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset-type URLs (built bundle, images, fonts, data) must 404 on a missing
    # file instead of falling through to index.html. The SPA fallback otherwise
    # masks broken deploys by answering 200 with HTML for e.g. a deleted image.
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|json)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
