version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cityflow-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - cityflow

  mongodb:
    image: mongo:7
    container_name: cityflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - cityflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityflow-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/cityflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
      TICK_INTERVAL_MINUTES: 360
      ADMIN_EMAIL: admin@cityflow.com
      ADMIN_PASSWORD: admin123
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cityflow

volumes:
  mongo-data:
  redis-data:

networks:
  cityflow:
    driver: bridge
